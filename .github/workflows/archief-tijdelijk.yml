name: Archief tijdelijk
on:
  push:
    branches: [claude/project-thread-3tvaas]
    paths: [.github/workflows/archief-tijdelijk.yml, .github/scripts/archief-tijdelijk.mjs]
permissions:
  contents: write
jobs:
  archief:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/archief-tijdelijk.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add archief && git commit -m "tijdelijk: tarievenpagina's uit het webarchief" && git push
